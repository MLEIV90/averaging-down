data_defaults:
  start: "2020-01-01"
  adjusted: false

assets:
  SPY:
    name: SPDR S&P 500 ETF
    asset_class: equity
    currency: USD
    timezone: "America/New_York"
    benchmark: true
    enabled: true
  GLD:
    name: SPDR Gold Shares
    asset_class: commodity
    currency: USD
    timezone: "America/New_York"
    enabled: true
  BTC-USD:
    name: Bitcoin USD
    asset_class: crypto
    currency: USD
    timezone: "UTC"
    resampling_cutoff: "16:00 EST" # Legacy label; runtime uses the explicit UTC cutoff below.
    daily_close_utc: "21:00"
    source_interval: "1h"
    enabled: true
